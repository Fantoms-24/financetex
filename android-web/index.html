<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3eee4" />
    <title>Листок</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f3eee4; color:#1c1915; }
      body { min-height:100svh; margin:0; display:grid; place-items:center; padding:24px; box-sizing:border-box; }
      main { width:min(100%,360px); padding:28px 24px; border:1px solid #ddd5c6; border-radius:24px; background:#faf6ee; box-shadow:0 16px 40px rgba(28,25,21,.08); text-align:center; }
      .mark { width:52px; height:52px; display:grid; place-items:center; margin:0 auto 16px; border-radius:18px; background:#e2eddc; color:#3d5c4a; font-size:25px; }
      h1 { margin:0; font-size:24px; letter-spacing:-.5px; } p { margin:10px 0 0; color:#6e675c; font-size:15px; line-height:1.5; }
    </style>
  </head>
  <body><main><div class="mark">◒</div><h1>Листок</h1><p>Подключаем ваше финансовое пространство…</p></main></body>
</html>
